on:
  push:
    branches:
      - main

name: Release

jobs:
  format-linter-tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-2022]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyODAS2
        run: pip install .[dev]

      - name: Check Formatting
        run: ruff format --diff

      - name: Linter
        run: ruff check

      - name: Tests
        run: pytest

  tag-release:
    name: Create Tag
    needs: format-linter-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute Version
        uses: paulhatch/semantic-version@v5.4.0
        id: semantic_version
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          bump_each_commit: true

      - name: Display Version
        run: echo ${{ steps.semantic_version.outputs.version }}

      - name: Set Version
        run: | 
          sed -i 's/0.0.0/${{ steps.semantic_version.outputs.version }}/g' pyproject.toml
          sed -i 's/0.0.0/${{ steps.semantic_version.outputs.version }}/g' doc/conf.py

      - name: Build sdist
        run: python -m build --sdist

      - name: Tag
        run:
          git config user.name "GitHub Actions Bot"
          git config user.email "github.actions.bot@github.com"
          git commit -am "Set version ${{ steps.semantic_version.outputs.version }}."
          git tag v${{ steps.semantic_version.outputs.version }}
          git push origin tag v${{ steps.semantic_version.outputs.version }}

      - name: Create Release and Upload sdist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ github.event.head_commit.message }}" >> notes.txt
          gh release create v${{ steps.semantic_version.outputs.version }} -t pyodas2_v${{ steps.semantic_version.outputs.version }} -F notes.txt
          gh release upload v${{ steps.semantic_version.outputs.version }} dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
